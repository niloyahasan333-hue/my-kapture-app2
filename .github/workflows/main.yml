# .yml (The Orchestrator)
name: Android Release APK Build - Final Clean Build
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # 🟢 환경 Variable Definitions (Secrets Injection)
    env:
      KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: 🚀 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # --- STEP 1: Gradle Wrapper &amp;amp;amp;amp;amp; Permissions (Fixes Error 127) ---
      - name: 🛠️ Setup Gradle Wrapper &amp;amp;amp;amp;amp; Permissions
        run: |
          echo "--- 1. Wrapping Gradle ---"
          ./gradlew wrapper --gradle-version 8.7
          chmod +x gradlew # 🟢 🔴 Critical Fix for Execution Error 127

          # টেস্টিং: পরিবেশ যাচাই করা
          ./gradlew tasks

      # --- STEP 2: Generate Keystore File ---
      - name: 🔑 Generate Release Keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore app/release.keystore \
            -alias ${{ env.KEY_ALIAS }} \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass ${{ env.KEY_STORE_PASSWORD }} \
            -keypass ${{ env.KEY_PASSWORD }} \
            -dname "CN=Android, OU=Development, O=MyApp, L=Rangpur, ST=Rangpur, C=BD"

      # --- STEP 3: Build Release APK ---
      - name: 📦 Build Release APK
        run: |
          # 🟢 Gradle স্বয়ংক্রিয়ভাবে (settings.gradle এবং app/build.gradle অনুযায়ী) সবকিছু খুঁজে নেবে
          ./gradlew :app:assembleRelease

      # --- STEP 4: Upload Artifacts (The Final Gate) ---
      - name: ☁️ Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: My-Final-Signed-App
          path: app/build/outputs/apk/release/app-release.apk
