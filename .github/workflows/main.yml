name: Android Release APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout all project files
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Setup Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 4. Check project files
      - name: Check Project Files
        run: |
          echo "Current directory:"
          pwd

          echo "Project files:"
          ls -la

          echo "App directory:"
          ls -la app || true

      # 5. Create Gradle Wrapper if missing
      - name: Initialize Gradle Wrapper
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "gradlew not found. Creating Gradle Wrapper..."
            gradle wrapper --gradle-version 8.7
          else
            echo "gradlew already exists."
          fi

          chmod +x gradlew

          echo "Gradle Wrapper:"
          ls -la gradlew
          ./gradlew --version

      # 6. Generate Release Keystore
      - name: Generate Release Keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p app

          keytool -genkeypair \
            -v \
            -keystore app/release.keystore \
            -alias app \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Kapture, OU=Development, O=Kapture, L=Rangpur, ST=Rangpur, C=BD"

      # 7. Build Release APK
      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --stacktrace

      # 8. Check APK
      - name: Check APK Output
        run: |
          echo "APK files:"
          find app/build/outputs/apk -type f -print

      # 9. Upload APK
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: KaptureApp-Release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
