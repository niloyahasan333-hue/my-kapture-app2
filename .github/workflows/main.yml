# .github/workflows/main_build.yml (The Final, Robust Orchestrator)
name: 🤖 KaptureApp - Full Attack Framework Build
on:
  push:
    branches:
      - main
  workflow_dispatch: # ম্যানুয়াল ট্রিগার করার অনুমতি দেয়

jobs:
  build:
    runs-on: ubuntu-latest

    # 🟢 Environment Variables (Secrets Injection - The Vault)
    env:
      KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: 🚀 Checkout Code (Get All Files)
        uses: actions/checkout@v4

      # --- Step 1: Setup Environment (The Base Layer) ---
      - name: ☕ Set up JDK 17 (Required Runtime)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # --- Step 2: Setup Gradle Wrapper (The Execution Engine) ---
      # 🛑 🔴 FIX: wrapper তৈরি করা এবং নিশ্চিত করা যে এটি এক্সিকিউটেবল
      - name: 🛠️ Initialize and Set Up Gradle Wrapper
        run: |
          # Gradle Wrapper তৈরি করে, যা টাস্ক চালানোর মূল ইঞ্জিন।
          ./gradlew wrapper --gradle-version 8.7 
          # এটিকে অবশ্যই এক্সিকিউটেবল করতে হবে
          chmod +x gradlew

      # --- Step 3: Keystore Generation (The Initial Weapon Setup) ---
      - name: 🔑 Generate Release Keystore
        run: |
          # এই কমান্ডটি সরাসরি Keytool ব্যবহার করে ফাইলটি তৈরি করে
          keytool -genkeypair \
            -v \
            -keystore app/release.keystore \
            -alias ${{ env.KEY_ALIAS }} \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass ${{ env.KEY_STORE_PASSWORD }} \
            -keypass ${{ env.KEY_PASSWORD }} \
            -dname "CN=Android, OU=Development, O=MyApp, L=Rangpur, ST=Rangpur, C=BD"

      # --- Step 4: Building the Core Product (The Assembly Line) ---
      - name: 📦 Build Release APK
        # 🟢 🔴 Execution Fix: সরাসরি ./gradlew কমান্ডটি ব্যবহার করা হচ্ছে 
        # যা নিশ্চিত করে যে Wrapper ইনস্টল করা আছে এবং কার্যকর।
        run: |
          ./gradlew :app:assembleRelease

      # --- Step 5: Final Output (The Delivery) ---
      - name: ☁️ Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KaptureApp-Release-Build
          path: app/build/outputs/apk/release/app-release.apk
