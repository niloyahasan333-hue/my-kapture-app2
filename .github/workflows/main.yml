# .github/workflows/main_build.yml (The Orchestrator)
name: 🤖 KaptureApp - Full Attack Framework Build
on:
  push:
    branches:
      - main
  workflow_dispatch: # ম্যানুয়াল ট্রিগার করার অনুমতি দেয়

jobs:
  build:
    runs-on: ubuntu-latest

    # 🟢 Environment Variables (Secrets Injection - The Vault)
    env:
      KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: 🚀 Checkout Code
        uses: actions/checkout@v4

      # --- Step 1: Setup Environment (The Base Layer) ---
      - name: ☕ Set up JDK 17 (Runtime Environment)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # --- Step 2: Prerequisite Check (The Pre-Flight Check) ---
      - name: 🛠️ Check and Setup Wrapper
        run: |
          echo "--- 🛠️ 1. Initializing Gradle Wrapper ---"
          ./gradlew wrapper --gradle-version 8.7 
          chmod +x gradlew # 🟢 🔴 Execution Fix for Code 127

      # --- Step 3: Keystore Generation (The Initial Weapon Setup) ---
      - name: 🔑 Generate Release Keystore
        run: |
          echo "--- 🔑 2. Generating Keystore ---"
          keytool -genkeypair \
            -v \
            -keystore app/release.keystore \
            -alias ${{ env.KEY_ALIAS }} \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass ${{ env.KEY_STORE_PASSWORD }} \
            -keypass ${{ env.KEY_PASSWORD }} \
            -dname "CN=Android, OU=Development, O=MyApp, L=Rangpur, ST=Rangpur, C=BD"

      # --- Step 4: Building the Core Product (The Assembly Line) ---
      - name: 📦 Build Release APK
        run: |
          echo "--- 📦 3. Building Application Module ---"
          ./gradlew :app:assembleRelease

      # --- Step 5: Final Output (The Delivery) ---
      - name: ☁️ Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KaptureApp-Release-Build
          path: app/build/outputs/apk/release/app-release.apk
          
